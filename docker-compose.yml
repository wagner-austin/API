# =============================================================================
# Root Docker Compose - Shared Infrastructure
# =============================================================================
# Start this FIRST, then start individual services from their directories.
#
# Usage:
#   docker compose up -d                    # Start Redis + create network
#   cd services/data-bank-api && docker compose up -d   # Then start services
#
# Or use Makefile:
#   make infra                              # Start Redis
#   make up-trainer                         # Start Redis + Model-Trainer
#   make up SERVICE=data-bank-api           # Start Redis + specific service
#
# Port map:
#   - 6379:  Redis (this file)
#   - 8000:  turkic-api
#   - 8001:  data-bank-api
#   - 8002:  qr-api
#   - 8003:  transcript-api
#   - 8004:  handwriting-ai
#   - 8005:  Model-Trainer
#   - 8006:  music-wrapped-api
#   - 8007:  covenant-radar-api
#   - 8008:  grandma-api
#   - 8009:  github-stats-api
#   - 8010:  opportunity-radar-api
#   - 8011:  Art-Trainer
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - platform-network

  kafka:
    image: apache/kafka:3.8.0
    container_name: platform-kafka
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft: this broker is also the controller, so no
      # ZooKeeper and no second container to keep alive.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://platform-kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@platform-kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # Replication of 1 is the only valid setting on a single broker.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - platform-network

  postgres:
    image: postgres:16-alpine
    container_name: platform-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: covenant
      POSTGRES_PASSWORD: covenant
      POSTGRES_DB: covenant
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covenant -d covenant"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - platform-network

  gateway:
    image: traefik:v3
    container_name: traefik
    command:
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      - --log.level=INFO
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=platform-network
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8080:8080" # The Traefik Web UI (Dashboard)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - platform-network
    restart: unless-stopped

networks:
  platform-network:
    driver: bridge
    name: platform-network

volumes:
  redis-data:
  postgres-data:
  kafka-data:
