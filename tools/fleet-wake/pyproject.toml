[build-system]
requires = ["poetry-core>=1.3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "fleet-wake"
version = "0.1.0"
description = "Announce fleet dispatch results on the agent board, so the session that dispatched a suite is woken when it ends"
authors = ["Austin Wagner <austinwagner@msn.com>"]
packages = [
  { include = "fleet_wake", from = "src" },
]
readme = "README.md"
include = ["src/fleet_wake/py.typed"]

[tool.poetry.dependencies]
python = "^3.11"
typing-extensions = "^4.12.2"
platform-core = { path = "../../libs/platform_core", develop = true }
fleet = { path = "../fleet", develop = true }
board-watch = { path = "../board-watch", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-timeout = "^2.4.0"
mypy = "^2.3.1"
ruff = "^0.16.6"
pytest-cov = "^7.1.0"
pytest-xdist = "^3.8.0"

[tool.poetry.scripts]
fleet-wake = "fleet_wake.cli.wake:entrypoint"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_subclassing_any = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
files = ["src", "tests", "scripts"]
mypy_path = ["src"]
explicit_package_bases = true
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E","F","I","B","BLE","UP","N","C4","SIM","RET","C90","RUF","ANN"
]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "Do not use typing.Any; prefer precise types or Protocols/TypedDicts." }
"typing.cast" = { msg = "Do not use typing.cast; prefer adapters or precise types." }
"typing.TypeAlias" = { msg = "Do not use TypeAlias; use Literal types or expand unions explicitly." }

[tool.coverage.run]
source = ["src", "scripts"]
omit = []
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v -n auto --dist loadscope"
timeout = 300
timeout_method = "thread"
