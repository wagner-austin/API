[build-system]
requires = ["poetry-core>=1.3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "fleet"
version = "0.1.0"
description = "Dispatch make check and measurement jobs to the machines on the tailnet, with a ledger, per-node budgets and a subscribable event feed"
authors = ["Austin Wagner <austinwagner@msn.com>"]
packages = [
  { include = "fleet", from = "src" },
]
readme = "README.md"
include = ["src/fleet/py.typed"]

[tool.poetry.dependencies]
python = "^3.11"
typing-extensions = "^4.12.2"
platform-core = { path = "../../libs/platform_core", develop = true }
# A RUNTIME dependency, not a dev one. `fleet.core.manifest` asks this package
# which paths outside a project the guards read, so a dispatch stages them --
# see its module docstring for the three declaration rules that failed on a
# real node when it did not.
monorepo-guards = { path = "../../libs/monorepo_guards", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-timeout = "^2.4.0"
mypy = "^2.3.1"
ruff = "^0.16.6"
pytest-cov = "^7.1.0"
pytest-xdist = "^3.8.0"

[tool.poetry.scripts]
fleet-nodes = "fleet.cli.nodes:entrypoint"
fleet-preflight = "fleet.cli.preflight:entrypoint"
fleet-run = "fleet.cli.run:entrypoint"
fleet-collect = "fleet.cli.collect:entrypoint"
fleet-watch = "fleet.cli.watch:entrypoint"
fleet-cancel = "fleet.cli.cancel:entrypoint"
fleet-bootstrap = "fleet.cli.bootstrap:entrypoint"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_subclassing_any = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
files = ["src", "tests", "scripts"]
mypy_path = ["src"]
explicit_package_bases = true
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E","F","I","B","BLE","UP","N","C4","SIM","RET","C90","RUF","ANN"
]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "Do not use typing.Any; prefer precise types or Protocols/TypedDicts." }
"typing.cast" = { msg = "Do not use typing.cast; prefer adapters or precise types." }
"typing.TypeAlias" = { msg = "Do not use TypeAlias; use Literal types or expand unions explicitly." }

[tool.coverage.run]
source = ["src", "scripts"]
omit = []
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v -n auto --dist loadscope"
timeout = 300
timeout_method = "thread"
