# This is the centralized configuration for the monorepo guards.
# By default, we apply the strictest rules to all services to ensure
# consistency and prevent configuration drift.

[guards]
# "python" is the maturin ``python-source`` root used by the mixed Rust/Python
# crates (libs/cleargbm_rs): their importable Python lives there rather than in
# "src", which holds Rust. Listing it here keeps that code under the same guards
# as every other package instead of silently escaping them.
directories = ["src", "scripts", "tests", "python"]
exclude_parts = [
    ".venv",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache",
    "node_modules",
]
forbid_pyi = true
allow_print_in_tests = false

# Ban dataclasses in all "src" directories to enforce the use of TypedDict
# for data structures, especially those deserialized from external sources.
dataclass_ban_segments = [
    ["src"],
]
