<svg width="350" height="170" viewBox="0 0 350 170" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="langs-grad" x1="85.4%" y1="14.6%" x2="14.6%" y2="85.4%">
<stop offset="0%" stop-color="#0a0a0f"/><stop offset="50%" stop-color="#1a0a2e"/><stop offset="100%" stop-color="#0a0a0f"/>
</linearGradient>
</defs>
<style>
.header { font: 600 18px 'Segoe UI', sans-serif; fill: #00fff9; }
.lang-name { font: 400 12px 'Segoe UI', sans-serif; fill: #e0e0e0; }
.lang-pct { font: 400 12px 'Segoe UI', sans-serif; fill: #e0e0e0; opacity: 0.8; }}

@keyframes fadeInAnimation {
  0% { opacity: 0; }
  100% { opacity: 1; }
}
@keyframes growWidthAnimation {
  0% { transform: scaleX(0); }
  100% { transform: scaleX(1); }
}
@keyframes scaleInAnimation {
  0% { transform: scale(0); }
  100% { transform: scale(1); }
}
@keyframes rankCircleAnimation {
  0% { stroke-dashoffset: 251.32; }
  100% { stroke-dashoffset: 0; }
}
.fade-in { animation: fadeInAnimation 0.3s ease-in-out forwards; }
.stagger-1 { animation-delay: 0.1s; opacity: 0; }
.stagger-2 { animation-delay: 0.2s; opacity: 0; }
.stagger-3 { animation-delay: 0.3s; opacity: 0; }
.stagger-4 { animation-delay: 0.4s; opacity: 0; }
.stagger-5 { animation-delay: 0.5s; opacity: 0; }
.grow-width { animation: growWidthAnimation 0.6s ease-in-out forwards; transform-origin: left; }
.scale-in { animation: scaleInAnimation 0.4s ease-in-out forwards; transform-origin: center; }
.rank-circle-anim {
  stroke-dasharray: 251.32;
  stroke-dashoffset: 251.32;
  animation: rankCircleAnimation 1s ease-in-out forwards;
  animation-delay: 0.5s;
}


@keyframes glowPulse {
  0%, 100% {
    filter: drop-shadow(0 0 2px #00fff9) drop-shadow(0 0 4px #00fff9);
  }
  50% {
    filter: drop-shadow(0 0 4px #00fff9) drop-shadow(0 0 8px #00fff9) drop-shadow(0 0 12px #00fff9);
  }
}
.glow-text {
  animation: glowPulse 2s ease-in-out infinite;
}
.glow-icon {
  filter: drop-shadow(0 0 2px #00fff9);
}


@keyframes twinkle {
  0%, 100% { opacity: 0.3; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.2); }
}
.sparkle {
  transform-box: fill-box;
  transform-origin: center;
}
.sparkle-1 { animation: twinkle 1.5s ease-in-out infinite; }
.sparkle-2 { animation: twinkle 2s ease-in-out infinite 0.3s; }
.sparkle-3 { animation: twinkle 1.8s ease-in-out infinite 0.6s; }
.sparkle-4 { animation: twinkle 2.2s ease-in-out infinite 0.9s; }

</style>
<rect x="0.5" y="0.5" width="349" height="169" rx="4.5" fill="url(#langs-grad)" stroke="#ff00ff" stroke-opacity="1"/>
<g class="sparkles"><path class="sparkle sparkle-1" d="M320.0,18.0 L320.6,20.0 L320.0,22.0 L319.4,20.0 Z" fill="#ff00ff"/><path class="sparkle sparkle-2" d="M184.5,24.4 L185.4,27.4 L184.5,30.4 L183.6,27.4 Z" fill="#ff00ff"/><path class="sparkle sparkle-3" d="M310.6,42.9 L311.8,46.9 L310.6,50.9 L309.4,46.9 Z" fill="#ff00ff"/><path class="sparkle sparkle-4" d="M243.5,135.9 L244.1,137.9 L243.5,139.9 L242.9,137.9 Z" fill="#ff00ff"/><path class="sparkle sparkle-1" d="M301.1,70.8 L302.0,73.8 L301.1,76.8 L300.2,73.8 Z" fill="#ff00ff"/><path class="sparkle sparkle-2" d="M52.5,12.8 L53.7,16.8 L52.5,20.8 L51.3,16.8 Z" fill="#ff00ff"/><path class="sparkle sparkle-3" d="M291.7,98.7 L292.3,100.7 L291.7,102.7 L291.1,100.7 Z" fill="#ff00ff"/><path class="sparkle sparkle-4" d="M111.6,145.5 L112.5,148.5 L111.6,151.5 L110.7,148.5 Z" fill="#ff00ff"/></g>
<text x="25" y="35" class="header glow-text">Most Used Languages</text>
<rect x="25" y="55" width="300" height="8" rx="2" fill="#ff00ff"/>
<rect x="25.0" y="55" width="250.2" height="8" fill="#3572A5" class="grow-width"/>
<rect x="275.2" y="55" width="30.8" height="8" fill="#000080" class="grow-width"/>
<rect x="306.0" y="55" width="6.8" height="8" fill="#f1e05a" class="grow-width"/>
<rect x="312.7" y="55" width="6.5" height="8" fill="#3178c6" class="grow-width"/>
<rect x="319.3" y="55" width="2.1" height="8" fill="#663399" class="grow-width"/>
<rect x="321.4" y="55" width="1.5" height="8" fill="#427819" class="grow-width"/>
<rect x="322.9" y="55" width="0.8" height="8" fill="#012456" class="grow-width"/>
<rect x="323.6" y="55" width="0.5" height="8" fill="#384d54" class="grow-width"/>
<g class="fade-in stagger-1"><circle cx="30" cy="76" r="5" fill="#3572A5"/><text x="40" y="80" class="lang-name">Python</text><text x="40" y="92" class="lang-pct">83.4%</text></g>
<g class="fade-in stagger-2"><circle cx="130" cy="76" r="5" fill="#000080"/><text x="140" y="80" class="lang-name">Lua</text><text x="140" y="92" class="lang-pct">10.3%</text></g>
<g class="fade-in stagger-3"><circle cx="230" cy="76" r="5" fill="#f1e05a"/><text x="240" y="80" class="lang-name">JavaScript</text><text x="240" y="92" class="lang-pct">2.3%</text></g>
<g class="fade-in stagger-4"><circle cx="30" cy="96" r="5" fill="#3178c6"/><text x="40" y="100" class="lang-name">TypeScript</text><text x="40" y="112" class="lang-pct">2.2%</text></g>
<g class="fade-in stagger-5"><circle cx="130" cy="96" r="5" fill="#663399"/><text x="140" y="100" class="lang-name">CSS</text><text x="140" y="112" class="lang-pct">0.7%</text></g>
<g class="fade-in stagger-5"><circle cx="230" cy="96" r="5" fill="#427819"/><text x="240" y="100" class="lang-name">Makefile</text><text x="240" y="112" class="lang-pct">0.5%</text></g>
<g class="fade-in stagger-5"><circle cx="30" cy="116" r="5" fill="#012456"/><text x="40" y="120" class="lang-name">PowerShell</text><text x="40" y="132" class="lang-pct">0.3%</text></g>
<g class="fade-in stagger-5"><circle cx="130" cy="116" r="5" fill="#384d54"/><text x="140" y="120" class="lang-name">Dockerfile</text><text x="140" y="132" class="lang-pct">0.2%</text></g>
</svg>