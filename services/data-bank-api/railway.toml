# Railway configuration for data-bank-api

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
target = "api"

[deploy]
healthcheckPath = "/readyz"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
startCommand = "hypercorn 'data_bank_api.api.main:create_app()' --bind [::]:${PORT:-8000}"

[variables]
DATA_ROOT = "/data/files"
MIN_FREE_GB = "2"
DELETE_STRICT_404 = "false"
REDIS_URL = "${{Redis.REDIS_URL}}"

# API service uses the default Docker CMD (api target).
# For a dedicated worker service, set the build target to `worker`
# and startCommand to `databank-rq-worker`.

# API keys must be configured per environment in Railway UI:
# API_UPLOAD_KEYS = "turkic-api-key"
# API_READ_KEYS = "model-trainer-key"
# API_DELETE_KEYS = "turkic-api-key"
