[build-system]
requires = ["poetry-core>=1.3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "covenant-radar-api"
version = "0.1.0"
description = "Loan covenant monitoring and breach prediction API"
authors = ["Austin Wagner <austinwagner@msn.com>"]
packages = [
  { include = "covenant_radar_api", from = "src" },
]
readme = "README.md"
include = [
  "src/covenant_radar_api/py.typed",
  # Vendored Chart.js served by the dashboard route. Without this the wheel
  # ships the route but not the asset, and /dashboard renders chartless.
  "src/covenant_radar_api/api/static/chart.umd.min.js",
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.124"
hypercorn = "^0.18"
redis = "^7.1"
rq = "^2.3"
psycopg = {version = "^3.3", extras = ["binary", "pool"]}
httpx = "^0.28"
xgboost = "^3.1"
numpy = "^2.3"
scikit-learn = "^1.7"
rich = "^14.2"

ddtrace = {version = "^4.1", python = "^3.11,<3.15"}
datadog = "^0.52"

confluent-kafka = "^2.12"

google-genai = "^1.0"

platform-core = { path = "../../libs/platform_core", develop = true }
platform-workers = { path = "../../libs/platform_workers", develop = true }
covenant-domain = { path = "../../libs/covenant_domain", develop = true }
covenant-ml = { path = "../../libs/covenant_ml", develop = true }
cleargbm-rs = { path = "../../libs/cleargbm_rs" }
covenant-nn = { path = "../../libs/covenant_nn", develop = true }
covenant-persistence = { path = "../../libs/covenant_persistence", develop = true }
openpyxl = "^3.1.0"
xlrd = "^2.0.2"

[[tool.poetry.source]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
xlwt = "^1.3.0"
pytest-asyncio = "^1.3.0"
pytest-timeout = "^2.3.1"
mypy = "^1.13.0"
ruff = "^0.14.4"
fakeredis = {version = "^2.26", extras = ["lua"]}
pytest-cov = "^7.0.0"
pytest-xdist = "^3.6.1"
typing-extensions = "^4.12.0"

[tool.poetry.scripts]
covenant-rq-worker = "covenant_radar_api.worker_entry:main"
covenant-streaming-worker = "covenant_radar_api.generic_worker_entry:main"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_subclassing_any = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
files = ["src", "tests", "scripts"]
mypy_path = ["src"]
explicit_package_bases = true
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
exclude = [".venv", "mckinnon_sources"]

[tool.ruff.lint]
select = [
    "E","F","I","B","BLE","UP","N","C4","SIM","RET","C90","RUF","ANN"
]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "Do not use typing.Any; prefer precise types or Protocols/TypedDicts." }
"typing.cast" = { msg = "Do not use typing.cast; prefer adapters or precise types." }
"typing.TypeAlias" = { msg = "Do not use TypeAlias; use Literal types or expand unions explicitly." }

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true

[tool.coverage.run]
source = ["src", "scripts"]
# No omissions: the 100% gate below covers every module that ships.
omit = []
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# The ML tests used to fail intermittently under -n auto with MemoryError and
# xgboost bad_malloc. The cause was not worker count: their configs omitted
# "device", so each resolved device="auto" -> cuda and every xdist worker
# opened its own CUDA context against a single GPU. Those configs now pin
# "device": "cpu", after which -n auto runs clean. Keep the device pins if this
# ever regresses - capping workers only masks it. The Makefile deliberately
# does not pass -n, so this is the single source of truth.
addopts = "-v -n auto --dist loadscope"
timeout = 60
timeout_method = "thread"
filterwarnings = [
    "ignore::sklearn.exceptions.ConvergenceWarning",
    "ignore::ResourceWarning",
]
