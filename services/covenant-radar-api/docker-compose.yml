# Docker Compose for local development
# Usage: docker compose up -d
# NOTE: Requires root docker-compose to be running first (provides platform-redis, platform-postgres)

services:
  api:
    build:
      context: ../..
      dockerfile: services/covenant-radar-api/Dockerfile
      target: api
    container_name: covenant-radar-api
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://platform-redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-postgresql://covenant:covenant@platform-postgres:5432/covenant}
    volumes:
      - ./data:/data
      - ./models:/data/models
      - ./logs:/data/logs
    ports:
      - "8007:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.covenant.rule=PathPrefix(`/covenant`)"
      - "traefik.http.routers.covenant.middlewares=covenant-strip"
      - "traefik.http.middlewares.covenant-strip.stripprefix.prefixes=/covenant"
      - "traefik.http.services.covenant.loadbalancer.server.port=8000"
      - "traefik.docker.network=platform-network"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - platform-network

  worker:
    build:
      context: ../..
      dockerfile: services/covenant-radar-api/Dockerfile
      target: worker
    container_name: covenant-radar-worker
    command: ["covenant-rq-worker"]
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://platform-redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-postgresql://covenant:covenant@platform-postgres:5432/covenant}
    volumes:
      - ./data:/data
      - ./models:/data/models
      - ./logs:/data/logs
    restart: unless-stopped
    networks:
      - platform-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  streaming-worker:
    build:
      context: ../..
      dockerfile: services/covenant-radar-api/Dockerfile
      target: streaming
    container_name: covenant-streaming-worker
    env_file:
      - .env
    environment:
      - STREAMING__ENABLED=${STREAMING__ENABLED:-false}
      - STREAMING__DOMAIN=${STREAMING__DOMAIN:-weather}
      # PLAINTEXT targets the in-stack broker. Point at Confluent Cloud by
      # setting SASL_SSL with the API key and secret instead.
      - CONFLUENT__BOOTSTRAP_SERVERS=${CONFLUENT__BOOTSTRAP_SERVERS:-platform-kafka:9092}
      - CONFLUENT__SECURITY_PROTOCOL=${CONFLUENT__SECURITY_PROTOCOL:-PLAINTEXT}
      - MODEL_PATH=${MODEL_PATH:-/data/models/active_xgb.ubj}
      - MODEL_VERSION=${MODEL_VERSION:-v1.0.0}
      - WEATHER__STATE_PATH=${WEATHER__STATE_PATH:-/data/weather/temporal_state.json}
      - WEATHER__STATION_MAP_PATH=${WEATHER__STATION_MAP_PATH:-/data/weather/station_map.json}
    volumes:
      - ./data:/data
      - ./models:/data/models
      - ./logs:/data/logs
    restart: unless-stopped
    networks:
      - platform-network

networks:
  platform-network:
    external: true
