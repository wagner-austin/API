[build-system]
requires = ["poetry-core>=1.3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "art-trainer-server"
version = "0.1.0"
description = "Art Trainer API and worker for LoRA/IP-Adapter training (SD1.5, SDXL, FLUX)"
authors = ["Austin Wagner <austinwagner@msn.com>"]
packages = [
  { include = "art_trainer", from = "src" },
]
readme = "README.md"
include = ["src/art_trainer/py.typed"]

[[tool.poetry.source]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.124"
hypercorn = "^0.18"
redis = "^7.1"
rq = "^2.3"
python-json-logger = "^3.2.1"
typing-extensions = "^4.12.2"
httpx = "^0.28"
python-multipart = "^0.0.22"
toml = "^0.10.2"
torch = {version = "^2.6", source = "pytorch-cu126"}
transformers = "^5.1"
pillow = "^11.0"
openai = "^2.21"
google-genai = "^1.60"
python-dotenv = "^1.2.1"
rich = "^14.3.2"
# Kohya_ss / sd-scripts training dependencies
accelerate = "^1.7.0"
diffusers = {version = ">=0.32", extras = ["torch"]}
safetensors = "^0.4.4"
einops = "^0.7.0"
bitsandbytes = "^0.45.0"
xformers = {version = ">=0.0.29", source = "pytorch-cu126"}
torchvision = {version = ">=0.20", source = "pytorch-cu126"}
lion-pytorch = "^0.0.6"
dadaptation = "^3.2"
prodigyopt = "^1.1.2"
pytorch-optimizer = "^3.5.0"
lycoris-lora = "^3.2.0"
omegaconf = "^2.3.0"
huggingface-hub = ">=1.3.0"
timm = "^1.0"
wandb = "^0.18"
schedulefree = "^1.4"
prodigy-plus-schedule-free = "^1.8.0"
peft = "^0.15"
sentencepiece = "^0.2.0"
platform-core = { path = "../../libs/platform_core", develop = true }
platform-workers = { path = "../../libs/platform_workers", develop = true }
platform-ml = { path = "../../libs/platform_ml", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-asyncio = "^1.3.0"
pytest-timeout = "^2.3.1"
mypy = "^1.13.0"
ruff = "^0.14.4"
types-redis = "^4.6.0.20241004"
types-toml = "^0.10.8"
fakeredis = {version = "^2.26", extras = ["lua"]}
pytest-cov = "^7.0.0"
pytest-xdist = "^3.6.1"
playwright = "^1.58.0"
playwright-stealth = "^2.0.2"

[tool.poetry.scripts]
arttrainer-rq-worker = "art_trainer.worker_entry:main"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_subclassing_any = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
files = ["src", "tests", "scripts"]
mypy_path = ["src"]
explicit_package_bases = true
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E","F","I","B","BLE","UP","N","C4","SIM","RET","C90","RUF","ANN"
]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # load_dotenv() must run before imports

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "Do not use typing.Any; prefer precise types or Protocols/TypedDicts." }
"typing.cast" = { msg = "Do not use typing.cast; prefer adapters or precise types." }
"typing.TypeAlias" = { msg = "Do not use TypeAlias; use Literal types or expand unions explicitly." }

[tool.coverage.run]
source = ["src", "scripts"]
omit = []
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v -n auto --dist loadscope"
# 900, not 300. This is a torch project on the same 32-thread box as
# Model-Trainer, where the slowest test measured 99.18 s ALONE on an idle machine
# while the bound was 300 s. Under `-n auto` each of ~31 workers also spins
# torch's own intra-op thread pool, so the parallel case is several times slower.
#
# Windows has no SIGALRM, so timeout_method can only be "thread", whose expiry
# calls os._exit(1): the worker dies with no cleanup and no protocol shutdown,
# and the xdist controller is left waiting on a dead channel. A timeout here is
# not a soft failure. See scripts/run-tests.ps1 for the 2026-08-19 incident.
timeout = 900
timeout_method = "thread"
filterwarnings = [
    "ignore::DeprecationWarning:importlib._bootstrap",  # SWIG types from PIL/BLIP
]
