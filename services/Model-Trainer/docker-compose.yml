# Docker Compose for local development
# Usage: docker compose up -d
# NOTE: Requires root docker-compose to be running first (provides platform-redis + network)

services:
  api:
    build:
      context: ../..
      dockerfile: services/Model-Trainer/Dockerfile
      target: api
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cu124}
        GIT_COMMIT: ${GIT_COMMIT:-}
    container_name: model-trainer-api
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://platform-redis:6379/0}
      - HF_HOME=/hf-cache
    volumes:
      - ./artifacts:/data/artifacts
      # checkpoints and model staging live on named volumes, NOT the host bind:
      # bind-mount writes cross the WSL/Windows file-sharing boundary at a few
      # MB/s, which turned each epoch's ~5.7GB checkpoint+best-model save into
      # a multi-minute stall (measured 2026-08-19 on run 3b1d6c5f). Nothing on
      # the host needs these files: models upload to the data bank and are
      # cleaned up; checkpoints are consumed by resume inside the containers.
      # Both services mount both volumes because the API's resume gate checks
      # checkpoint existence on the same path the worker writes.
      - trainer-checkpoints:/data/artifacts/checkpoints
      - trainer-model-staging:/data/artifacts/models
      - ./corpus:/data/corpus:ro
      - ./corpus_cache:/data/corpus_cache
      - ./runs:/data/runs
      - ./logs:/data/logs
      - hf-cache:/hf-cache
    ports:
      - "8005:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.trainer.rule=PathPrefix(`/trainer`)"
      - "traefik.http.routers.trainer.middlewares=trainer-strip"
      - "traefik.http.middlewares.trainer-strip.stripprefix.prefixes=/trainer"
      - "traefik.http.services.trainer.loadbalancer.server.port=8000"
      - "traefik.docker.network=platform-network"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - platform-network

  worker:
    build:
      context: ../..
      dockerfile: services/Model-Trainer/Dockerfile
      target: worker
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cu124}
        GIT_COMMIT: ${GIT_COMMIT:-}
    container_name: model-trainer-worker
    # The worker logs one JSON line per training step (tens of thousands per
    # run); an uncapped json-file log grows without bound, slows every
    # `docker logs` query, and feeds VHDX bloat. 200MB rolling window keeps
    # roughly the last few runs' logs.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "4"
    command: ["modeltrainer-rq-worker"]
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://platform-redis:6379/0}
      - HF_HOME=/hf-cache
    volumes:
      - ./artifacts:/data/artifacts
      # See the api service's volume comment: keep heavy per-epoch writes off
      # the WSL/Windows file-sharing boundary. Must match the api mounts.
      - trainer-checkpoints:/data/artifacts/checkpoints
      - trainer-model-staging:/data/artifacts/models
      - ./corpus:/data/corpus:ro
      - ./corpus_cache:/data/corpus_cache
      - ./runs:/data/runs
      - ./logs:/data/logs
      - hf-cache:/hf-cache
      - ${LLAMA_CPP_PATH:?Set LLAMA_CPP_PATH in .env}:/opt/llama.cpp:ro
    restart: unless-stopped
    networks:
      - platform-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  platform-network:
    external: true

volumes:
  hf-cache:
  trainer-checkpoints:
  trainer-model-staging:
