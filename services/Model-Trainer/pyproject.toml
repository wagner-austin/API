[build-system]
requires = ["poetry-core>=1.3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "model-trainer-server"
version = "0.1.0"
description = "Model Trainer API and worker (CPU-first, strict typing, RQ)"
authors = ["Austin Wagner <austinwagner@msn.com>"]
packages = [
  { include = "model_trainer", from = "src" },
]
readme = "README.md"
include = ["src/model_trainer/py.typed"]

[[tool.poetry.source]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
priority = "explicit"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.124"
hypercorn = "^0.18"
redis = "^7.1"
rq = "^2.3"
python-json-logger = "^3.2.1"
typing-extensions = "^4.12.2"
transformers = "^4.45.0"
datasets = "^3.0.1"
tokenizers = "^0.20.0"
httpx = "^0.28"
sentencepiece = "^0.2.1"
torch = {version = "^2.5", source = "pytorch-cu124"}
peft = "^0.14.0"
# Required by the qlora strategy, not optional to it: without this the
# 4-bit quantizer refuses to load and a qlora run cannot start.
bitsandbytes = "^0.45.0"
platform-core = { path = "../../libs/platform_core", develop = true }
platform-workers = { path = "../../libs/platform_workers", develop = true }
platform-ml = { path = "../../libs/platform_ml", develop = true, extras = ["wandb"] }

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-timeout = "^2.4.0"
mypy = "^2.3.1"
ruff = "^0.16.6"
types-redis = "^4.6.0.20241004"
fakeredis = {version = "^2.26", extras = ["lua"]}
pytest-cov = "^7.1.0"
pytest-xdist = "^3.8.0"

[tool.poetry.scripts]
modeltrainer-rq-worker = "model_trainer.worker_entry:main"
modeltrainer-cluster-train = "model_trainer.cluster.entry:entrypoint"
modeltrainer-score-baseline = "model_trainer.cli.score_baseline:entrypoint"
modeltrainer-score-run = "model_trainer.cli.score_run:entrypoint"
modeltrainer-continuations = "model_trainer.cli.continuations:entrypoint"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_subclassing_any = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
files = ["src", "tests", "scripts"]
mypy_path = ["src"]
explicit_package_bases = true
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E","F","I","B","BLE","UP","N","C4","SIM","RET","C90","RUF","ANN"
]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "Do not use typing.Any; prefer precise types or Protocols/TypedDicts." }
"typing.cast" = { msg = "Do not use typing.cast; prefer adapters or precise types." }
"typing.TypeAlias" = { msg = "Do not use TypeAlias; use Literal types or expand unions explicitly." }

[tool.coverage.run]
source = ["src", "scripts"]
omit = []
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# -n 8 RATHER THAN -n auto, AND BOTH HALVES OF THE REASON ARE MEASURED.
#
# On 2026-09-10 this suite ran 16-wide inside lavender's WSL and ballooned
# the VM to 25.88 GB against 1.83 GB of host memory left, at which point the
# host stopped scheduling the VM: everything inside froze, the runners' HTTPS
# listeners timed out, and BOTH GitHub runners dropped offline mid-run. One
# suite did that. It also explains why the 900s pytest-timeout below recorded
# ZERO firings over a 10322s hang -- a watchdog thread inside a VM that is not
# being scheduled cannot fire, so every bound armed INSIDE the VM is blind to
# this failure and only a bound outside it can see one.
#
# Measured here, same suite, same box, --no-cov, matched runs:
#
#   -n auto   24.45 GB peak over 38 processes   126 s
#   -n 8      16.86 GB peak over 23 processes   106 s
#
# So the cap is 31% lighter AND 16% faster. It is not a speed/safety trade
# and nothing was given up to buy the headroom.
#
# WHY IT IS FASTER IS NOT EXPLAINED HERE, deliberately. Oversubscription and
# torch's own intra-op pools are both plausible and neither was measured, and
# this file has already carried one confidently-narrated mechanism that turned
# out to be wrong. The numbers are the claim.
#
# The cap only binds where there are many cores; a box with 8 or fewer gets
# what `auto` would have given it. Measured on one machine, so the ratio is
# this machine's -- what generalises is the direction and the ceiling.
addopts = "-v -n 8 --dist loadscope"
# 900, not 300. Measured 2026-08-19: the slowest test here
# (test_cancel_during_eval_returns_partial_results, a 3-epoch CPU GPT-2 train)
# takes 99.18 s ALONE on a fully idle box. Under `-n auto` each of ~31 workers
# also spins torch's own intra-op thread pool, so the parallel case is several
# times slower and 300 s left only ~3x headroom -- the bound was firing on
# slow-but-working tests, not on hangs.
#
# That mattered because timeout_method has no benign path on Windows: there is no
# SIGALRM, so "thread" is the only option, and its expiry calls os._exit(1). The
# worker dies with no cleanup and no protocol shutdown, the xdist controller is
# left waiting on a dead channel, and the survivors block forever. See
# scripts/run-tests.ps1 for the 2026-08-19 incident.
#
# This bound is here to catch a genuine hang, not to police a slow test. Revisit
# with real parallel-run durations rather than by guessing.
timeout = 900
timeout_method = "thread"
