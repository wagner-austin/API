[build-system]
requires = ["poetry-core>=1.3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "model-trainer-server"
version = "0.1.0"
description = "Model Trainer API and worker (CPU-first, strict typing, RQ)"
authors = ["Austin Wagner <austinwagner@msn.com>"]
packages = [
  { include = "model_trainer", from = "src" },
]
readme = "README.md"
include = ["src/model_trainer/py.typed"]

[[tool.poetry.source]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
priority = "explicit"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.124"
hypercorn = "^0.18"
redis = "^7.1"
rq = "^2.3"
python-json-logger = "^3.2.1"
typing-extensions = "^4.12.2"
transformers = "^4.45.0"
datasets = "^3.0.1"
tokenizers = "^0.20.0"
httpx = "^0.28"
sentencepiece = "^0.2.1"
torch = {version = "^2.5", source = "pytorch-cu124"}
peft = "^0.14.0"
# Required by the qlora strategy, not optional to it: without this the
# 4-bit quantizer refuses to load and a qlora run cannot start.
bitsandbytes = "^0.45.0"
platform-core = { path = "../../libs/platform_core", develop = true }
platform-workers = { path = "../../libs/platform_workers", develop = true }
platform-ml = { path = "../../libs/platform_ml", develop = true, extras = ["wandb"] }

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-asyncio = "^1.3.0"
pytest-timeout = "^2.3.1"
mypy = "^1.13.0"
ruff = "^0.14.4"
types-redis = "^4.6.0.20241004"
fakeredis = {version = "^2.26", extras = ["lua"]}
pytest-cov = "^7.0.0"
pytest-xdist = "^3.6.1"

[tool.poetry.scripts]
modeltrainer-rq-worker = "model_trainer.worker_entry:main"
modeltrainer-cluster-train = "model_trainer.cluster.entry:entrypoint"
modeltrainer-score-baseline = "model_trainer.cli.score_baseline:entrypoint"
modeltrainer-continuations = "model_trainer.cli.continuations:entrypoint"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_subclassing_any = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
files = ["src", "tests", "scripts"]
mypy_path = ["src"]
explicit_package_bases = true
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E","F","I","B","BLE","UP","N","C4","SIM","RET","C90","RUF","ANN"
]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "Do not use typing.Any; prefer precise types or Protocols/TypedDicts." }
"typing.cast" = { msg = "Do not use typing.cast; prefer adapters or precise types." }
"typing.TypeAlias" = { msg = "Do not use TypeAlias; use Literal types or expand unions explicitly." }

[tool.coverage.run]
source = ["src", "scripts"]
omit = []
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v -n auto --dist loadscope"
# 900, not 300. Measured 2026-08-19: the slowest test here
# (test_cancel_during_eval_returns_partial_results, a 3-epoch CPU GPT-2 train)
# takes 99.18 s ALONE on a fully idle box. Under `-n auto` each of ~31 workers
# also spins torch's own intra-op thread pool, so the parallel case is several
# times slower and 300 s left only ~3x headroom -- the bound was firing on
# slow-but-working tests, not on hangs.
#
# That mattered because timeout_method has no benign path on Windows: there is no
# SIGALRM, so "thread" is the only option, and its expiry calls os._exit(1). The
# worker dies with no cleanup and no protocol shutdown, the xdist controller is
# left waiting on a dead channel, and the survivors block forever. See
# scripts/run-tests.ps1 for the 2026-08-19 incident.
#
# This bound is here to catch a genuine hang, not to police a slow test. Revisit
# with real parallel-run durations rather than by guessing.
timeout = 900
timeout_method = "thread"
