# Docker Compose for local development
# Usage: docker compose up -d
# NOTE: Requires root docker-compose to be running first (provides platform-redis + network)

services:
  api:
    build:
      context: ../..
      dockerfile: services/doc-extract-api/Dockerfile
      target: api
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cu128}
    container_name: doc-extract-api
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://platform-redis:6379/0}
      - DOCTR_CACHE_DIR=/doctr-cache
    volumes:
      - ./logs:/data/logs
      - doctr-cache:/doctr-cache
      - ${DOC_EXTRACT_FILES_DIR:-../../files}:/data/files:ro
    ports:
      - "8012:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.doc-extract.rule=PathPrefix(`/doc-extract`)"
      - "traefik.http.routers.doc-extract.middlewares=doc-extract-strip"
      - "traefik.http.middlewares.doc-extract-strip.stripprefix.prefixes=/doc-extract"
      - "traefik.http.services.doc-extract.loadbalancer.server.port=8000"
      - "traefik.docker.network=platform-network"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - platform-network

  worker:
    build:
      context: ../..
      dockerfile: services/doc-extract-api/Dockerfile
      target: worker
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cu128}
    container_name: doc-extract-worker
    command: ["doc-extract-rq-worker"]
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://platform-redis:6379/0}
      - DOCTR_CACHE_DIR=/doctr-cache
    volumes:
      - ./logs:/data/logs
      - doctr-cache:/doctr-cache
      - ${DOC_EXTRACT_FILES_DIR:-../../files}:/data/files:ro
    restart: unless-stopped
    networks:
      - platform-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  platform-network:
    external: true

volumes:
  doctr-cache:
