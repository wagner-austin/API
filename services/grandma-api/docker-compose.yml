services:
  api:
    build:
      context: ../..
      dockerfile: services/grandma-api/Dockerfile
    container_name: grandma-api
    ports:
      - "8008:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - API_TOKEN=${API_TOKEN}
      - PORT=8080
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grandma.rule=PathPrefix(`/grandma`)"
      - "traefik.http.routers.grandma.middlewares=grandma-strip"
      - "traefik.http.middlewares.grandma-strip.stripprefix.prefixes=/grandma"
      - "traefik.http.services.grandma.loadbalancer.server.port=8080"
      - "traefik.docker.network=platform-network"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - platform-network

networks:
  platform-network:
    external: true
