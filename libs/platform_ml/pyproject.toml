[build-system]
requires = ["poetry-core>=1.3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "platform-ml"
version = "0.1.0"
description = "Shared ML artifact handling: manifest schema, tarball helpers, and Weights & Biases integration."
authors = ["Austin Wagner <austinwagner@msn.com>"]
packages = [
  { include = "platform_ml", from = "src" },
]
readme = "README.md"
include = ["src/platform_ml/py.typed"]

[[tool.poetry.source]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"

[[tool.poetry.source]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
priority = "explicit"

[tool.poetry.dependencies]
python = "^3.11"
platform-core = { path = "../platform_core", develop = true }
numpy = "^2.3.5"
sentencepiece = "^0.2.1"
shap = "^0.51"
# torch is not a dependency here, not even an extra. Only torch_types' importer
# and the device selector reach it, at call time, and every consumer that calls
# them (Model-Trainer, covenant_nn) declares torch itself; covenant_ml never
# does, and as a main dependency here it installed the 2.87 GB cu128 wheel into
# every fresh fleet venv of that package (board task 2e880b79). The dev group
# below installs it for this package's own tests.
wandb = { version = "^0.18", optional = true }
typing-extensions = "^4.12.0"
# nccl_lock evaluates a lock's environment markers with it.
packaging = "^26.3"

[tool.poetry.extras]
wandb = ["wandb"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
pytest-xdist = "^3.8.0"
pytest-cov = "^7.1.0"
mypy = "^2.4.1"
ruff = "^0.17.5"
typing-extensions = "^4.12.0"
# torch's NCCL must be xgboost's: nvidia-nccl-cu12 and nvidia-nccl-cu13 both
# install nvidia/nccl/lib/libnccl.so.2, so removing either deletes the library
# the other loads. xgboost needs nccl-cu12 through 3.3 and nccl-cu13 from
# 3.4.0, which needs Python 3.12, so each Python takes the newest torch built
# against the same NCCL; CUDA 13.2 is the newest demure's 595 driver runs.
torch = [
  { version = "^2.14.1", source = "pytorch-cu126", python = "~3.11" },
  { version = "^2.15.0", source = "pytorch-cu132", python = ">=3.12,<3.16" },
]
wandb = "^0.18"
scikit-learn = "^1.8"
xgboost = "^3.1"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_subclassing_any = true
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
files = ["src", "tests", "scripts"]
mypy_path = ["src"]
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
exclude = [".venv"]

[tool.ruff.lint]
select = [
  "E","F","I","B","BLE","UP","N","C4","SIM","RET","C90","RUF","ANN"
]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "Do not use typing.Any; prefer precise types or Protocols/TypedDicts." }
"typing.cast" = { msg = "Do not use typing.cast; prefer adapters or precise types." }
"typing.TypeAlias" = { msg = "Do not use TypeAlias; use Literal types or expand unions explicitly." }

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true

[tool.coverage.run]
source = ["src", "scripts"]
omit = []
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v -n auto --dist loadscope"

