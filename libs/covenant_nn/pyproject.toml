[build-system]
requires = ["poetry-core>=1.3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "covenant-nn"
version = "0.1.0"
description = "PyTorch neural network backends (MLP, LSTM) for covenant_ml."
authors = ["Austin Wagner <austinwagner@msn.com>"]
packages = [
  { include = "covenant_nn", from = "src" },
]
include = ["src/covenant_nn/py.typed"]

[[tool.poetry.source]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"

[[tool.poetry.source]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
priority = "explicit"

[tool.poetry.dependencies]
python = "^3.11"
covenant-ml = { path = "../covenant_ml", develop = true }
platform-ml = { path = "../platform_ml", develop = true }
platform-core = { path = "../platform_core", develop = true }
# torch's NCCL must be xgboost's, which covenant_ml brings: nvidia-nccl-cu12
# and nvidia-nccl-cu13 both install nvidia/nccl/lib/libnccl.so.2, so removing
# either deletes the library the other loads. xgboost needs nccl-cu12 through
# 3.3 and nccl-cu13 from 3.4.0, which needs Python 3.12, so each Python takes
# the newest torch built against the same NCCL; CUDA 13.2 is the newest
# demure's 595 driver runs. A consumer's root names these two sources too.
torch = [
  { version = "^2.14.1", source = "pytorch-cu126", python = "~3.11" },
  { version = "^2.15.0", source = "pytorch-cu132", python = ">=3.12,<3.16" },
]
numpy = "^2.3"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-xdist = "^3.8.0"
pytest-cov = "^7.1.0"
mypy = "^2.3.1"
ruff = "^0.16.6"
typing-extensions = "^4.12.0"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_subclassing_any = true
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
files = ["src", "tests", "scripts"]
mypy_path = ["src"]
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
exclude = [".venv"]

[tool.ruff.lint]
select = [
  "E","F","I","B","BLE","UP","N","C4","SIM","RET","C90","RUF","ANN"
]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "Do not use typing.Any; prefer precise types or Protocols/TypedDicts." }
"typing.cast" = { msg = "Do not use typing.cast; prefer adapters or precise types." }
"typing.TypeAlias" = { msg = "Do not use TypeAlias; use Literal types or expand unions explicitly." }

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true

[tool.coverage.run]
source = ["src", "scripts"]
omit = []
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v -n auto --dist loadscope"
