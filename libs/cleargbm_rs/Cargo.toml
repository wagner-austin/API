[package]
name = "cleargbm_rs"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust core for ClearGBM gradient boosting"
license = "MIT"
readme = "README.md"
repository = "https://github.com/wagner-austin/API"
keywords = ["machine-learning", "gradient-boosting", "gbm", "python-bindings"]
categories = ["science", "algorithms"]

[lib]
name = "cleargbm_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.27.2" }
numpy = "0.27.1"
ndarray = "0.17"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Rayon powers cross-feature parallelism in the histogram build passes
# (`build_feature_histograms` and `compute_child_histograms`). Each feature's
# per-node histogram is independent, so 18 features × 3-4 cores gives roughly
# 3-4x speedup on the tree-building hot loop. All safe-Rust; no unsafe code
# escape hatches added.
rayon = "1.10"

[dev-dependencies]
proptest = "1.5"

# =============================================================================
# Release profile — maximum-perf, one-shot compile
# =============================================================================
#
# `lto = "fat"` runs LLVM link-time optimization across the whole dependency
# graph, giving inliner and dead-code-eliminator visibility into rayon,
# pyo3, and numpy alongside our own crate. `codegen-units = 1` prevents
# LLVM from splitting the crate into parallel-compilable chunks, which
# maximizes cross-function inlining. Both trade build time for ~5-10% of
# runtime speedup on tight inner loops — the histogram accumulator is
# exactly that shape.
[profile.release]
# LTO experiments 2026-07-21: `lto = "fat"` regressed cleargbm ~15% (1.05s
# baseline → 1.20s). `lto = "thin"` was noise-neutral. Left off pending
# proper isolation vs. u32 sample_indices refactor.
# lto = "thin"
# codegen-units = 1

# =============================================================================
# Strict Lints (Equivalent to our Python mypy strict + ruff)
# =============================================================================

[lints.rust]
unsafe_code = "forbid"
missing_docs = "forbid"

[lints.clippy]
# All lints forbidden. Groups carry `priority = -1` so the specific lints
# configured below are allowed to refine them; at equal priority Cargo rejects
# the manifest outright ("lint group `all` has the same priority as a lint").
all = { level = "forbid", priority = -1 }
cargo = { level = "forbid", priority = -1 }

# No escape hatches (equivalent to no type: ignore, no noqa)
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"

# No silent failures (equivalent to no try/except recovery)
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unreachable = "forbid"
todo = "forbid"
unimplemented = "forbid"

# No lazy error propagation - forces explicit error handling
question_mark_used = "forbid"

# No unsafe conversions (equivalent to no cast()). All "forbid": the crate
# contains zero `as` casts and zero `#[expect]` escape hatches, so nothing
# needs to override these. `index_widen` uses `try_from` (compiles to the same
# single instruction as a cast, verified in emitted assembly) and gradients
# stay f64 end to end, so no narrowing conversion exists to justify.
as_conversions = "forbid"
cast_possible_truncation = "forbid"
cast_sign_loss = "forbid"
cast_precision_loss = "forbid"
cast_possible_wrap = "forbid"

# No implicit behavior
default_numeric_fallback = "forbid"
implicit_clone = "forbid"

# Explicit error handling
result_unit_err = "forbid"
map_err_ignore = "forbid"

# Code quality
clone_on_ref_ptr = "forbid"
redundant_closure_for_method_calls = "forbid"
manual_let_else = "forbid"
needless_pass_by_value = "forbid"

# Documentation
missing_docs_in_private_items = "forbid"
missing_errors_doc = "forbid"
