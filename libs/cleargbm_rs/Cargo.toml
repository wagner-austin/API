[package]
name = "cleargbm_rs"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust core for ClearGBM gradient boosting"
license = "MIT"
readme = "README.md"
repository = "https://github.com/wagner-austin/API"
keywords = ["machine-learning", "gradient-boosting", "gbm", "python-bindings"]
categories = ["science", "algorithms"]

[lib]
name = "cleargbm_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]
python-bindings = []

[dependencies]
pyo3 = { version = "0.27.2" }
numpy = "0.27.1"
ndarray = "0.17"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
proptest = "1.5"

# =============================================================================
# Strict Lints (Equivalent to our Python mypy strict + ruff)
# =============================================================================

[lints.rust]
unsafe_code = "forbid"
missing_docs = "forbid"

[lints.clippy]
# All lints forbidden
all = "forbid"
cargo = "forbid"

# No escape hatches (equivalent to no type: ignore, no noqa)
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"

# No silent failures (equivalent to no try/except recovery)
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unreachable = "forbid"
todo = "forbid"
unimplemented = "forbid"

# No lazy error propagation - forces explicit error handling
question_mark_used = "forbid"

# No unsafe conversions (equivalent to no cast())
as_conversions = "forbid"
cast_possible_truncation = "forbid"
cast_sign_loss = "forbid"
cast_precision_loss = "forbid"
cast_possible_wrap = "forbid"

# No implicit behavior
default_numeric_fallback = "forbid"
implicit_clone = "forbid"

# Explicit error handling
result_unit_err = "forbid"
map_err_ignore = "forbid"

# Code quality
clone_on_ref_ptr = "forbid"
redundant_closure_for_method_calls = "forbid"
manual_let_else = "forbid"
needless_pass_by_value = "forbid"

# Documentation
missing_docs_in_private_items = "forbid"
missing_errors_doc = "forbid"
