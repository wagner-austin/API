# Run TankpitBot in containers.
#
# Single bounded session:
#     cp .env.example .env      # then set TANKPIT_USERNAME / TANKPIT_PASSWORD
#     docker compose run --rm bot
#
# The FLEET (manager + N bot processes in ONE container — the spawner
# forks `sys.executable -c` children, so it works unchanged inside):
#     make image                # build from the newest release snapshot
#     make up-docker            # start; fleet page http://127.0.0.1:27300/
#     make down-docker          # graceful drain (docker stop -> SIGTERM ->
#                               # drain_on_interrupt; every bot quits to
#                               # the lobby before the manager exits)
#
# The capture lands in ./runs on the host, because the event log is what
# the session exists to produce — and for the fleet the shared ./runs
# mount IS the coordination fabric: knowledge.json exchange, claim
# files, stop sentinels, spawn records for adoption all ride it, so a
# replacement fleet container adopts exactly like a replacement host
# manager does.
#
# Context is the REPO ROOT (`../..`), not this directory: pyproject.toml
# takes monorepo-guards and platform-core as `../../libs/` path
# dependencies, which a context rooted here cannot reach. `make image`
# builds with the newest RELEASE SNAPSHOT as the context instead, so
# the image tag carries the same sha discipline as the `make fleet`
# ladder; FLEET_IMAGE selects that tag here.

services:
  fleet:
    build:
      context: ../..
      dockerfile: clients/TankpitBot/Dockerfile
    image: ${FLEET_IMAGE:-tankpit-fleet:local}
    command: tankpit-fleet
    environment:
      # HEADED, because every fleet child is streamed: the capture
      # records a rendered window, and each child brings its own Xvfb
      # display to render onto (tankpit_bot.stream.capture), so "no X
      # server in a container" stopped being true for this service.
      # The Bot constructor REFUSES headless+stream, so flipping this
      # back without also unsetting TANKPIT_STREAM_VIDEO is a loud
      # boot failure, not a silent black demo.
      TANKPIT_HEADLESS: "false"
      # Every child records its display into runs/bot/<instance>/hls/,
      # which the manager serves at /demo/video/{slot}/ straight off
      # the shared filesystem. The display number is the child's own
      # service port — already unique per live child.
      TANKPIT_STREAM_VIDEO: "true"
      # No in-page diagnostic HUD: its card sits on top of the game in
      # every captured frame, and the stream's viewers are strangers,
      # not the operator it was built for. The fleet page still gets
      # the same numbers through the per-tick hud.json mirror.
      TANKPIT_HUD_OVERLAY: "false"
      # Bind wide INSIDE the container so the published port reaches
      # the process; the loopback-only security property moves to the
      # port mapping below, which is the container boundary's
      # equivalent of the host default.
      TANKPIT_FLEET_HOST: "0.0.0.0"
      # The pool rides a read-only mount, never the image: the
      # checkout-relative default resolves into site-packages once the
      # package is pip-installed, so the path is named explicitly.
      TANKPIT_ACCOUNTS_FILE: /app/accounts.json
    ports:
      # Loopback only, and it stays that way. The demo at
      # austinwagner.org/tankpit does NOT reach the fleet through this
      # mapping — it reaches ``tankpit-public`` on the network below,
      # which forwards ``/demo/`` and 404s the operator surface. This
      # port is the operator's own door and is not published.
      - "127.0.0.1:27300:27300"
    networks:
      # The manager's own network, so nothing here changes for a fleet
      # run that is not being demoed.
      - default
      # The tunnel's network, joined as external. cloudflared and the
      # public filter live in the MCPs workspace compose; this is the
      # only way a container there can resolve ``fleet``. Joining a
      # network is not publishing a port: the filter is still the only
      # thing on that network that answers from the internet.
      - mcp-network
    volumes:
      - ./runs:/app/runs
      - ./accounts.json:/app/accounts.json:ro
      # Measured operator STATE, read-write: the bot writes newly
      # measured colour ranks back to the registry at runtime, and
      # host runs and container runs must share one ledger.
      - ./data:/app/data
      # Operator config overrides (TANKPIT_URL etc.). load_dotenv
      # never overrides real env vars, so the environment block above
      # stays senior.
      - ./.env:/app/.env:ro
    # N Chromiums, not one: the single-bot 1gb floor scaled up.
    shm_size: "2gb"
    # docker stop must be a DRAIN, not a kill: SIGTERM starts the
    # teardown-to-lobby for every bot and the manager exits after the
    # last one lands. Killing a tank mid-game is how rank gets lost,
    # so the grace period is sized to the slowest teardown observed,
    # with margin — interrupting the wait is safe, the manager owns
    # the drain.
    stop_grace_period: 10m
    restart: "no"


  bot:
    build:
      context: ../..
      dockerfile: clients/TankpitBot/Dockerfile
    image: tankpit-bot:local
    # Credentials by env, never baked and never mounted. This is the
    # FIRST branch of browser/accounts.py's resolution order, and the
    # only one that survives pip-installing the package — the other two
    # read a path computed relative to the module, which lands in
    # site-packages once installed. See the Dockerfile header.
    env_file:
      - .env
    environment:
      # No display in a container. The repo default is `false` because a
      # workstation run wants to watch the browser; here a visible
      # browser is not a preference, it is a crash.
      TANKPIT_HEADLESS: "true"
      TANKPIT_BOT_SESSION_SECONDS: "${SESSION_SECONDS:-30}"
    volumes:
      - ./runs:/app/runs
    # Chromium wants more than the default 64MB of shared memory and
    # renders blank pages without it. The documented alternative,
    # --disable-dev-shm-usage, moves the same traffic onto disk and is
    # slower; raising the limit is the cheaper fix for a short session.
    shm_size: "1gb"
    # A bounded session that exits on its own, so no restart policy:
    # `restart: unless-stopped` would relaunch the bot forever, which is
    # both wrong for a demo and a way to hammer a third-party server.
    restart: "no"

networks:
  # The fleet's own network, created per-project as compose always did.
  default:
  # The MCPs workspace's bridge, created by ITS compose (`name:
  # mcp-network`). External because this compose must never be the one
  # that creates it: a fleet started before the workspace would
  # otherwise make an empty network of the same name, and cloudflared
  # would come up on a different bridge with the same label and resolve
  # nothing. Absent workspace means `make up` fails by name here, which
  # is the honest failure — the demo edge genuinely is not there.
  mcp-network:
    external: true
    name: mcp-network
