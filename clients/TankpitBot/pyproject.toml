[build-system]
requires = ["poetry-core>=1.3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "tankpit-bot"
version = "0.1.0"
description = "Automated bot client for Tankpit.com browser game"
authors = ["Austin Wagner <austinwagner@msn.com>"]
packages = [
  { include = "tankpit_bot", from = "src" },
]
readme = "README.md"
include = [
  "src/tankpit_bot/py.typed",
  "src/tankpit_bot/data/*.gif",
  "src/tankpit_bot/data/xor_static_key.txt",
  "src/tankpit_bot/data/hls.min.js",
]

[tool.poetry.dependencies]
python = "^3.11"
playwright = "^1.57"
websockets = "^15.0"
httpx = "^0.28"
rich = "^14.0"
python-dotenv = "^1.0.0"
pillow = "^11.0"
aiohttp = "^3.10"
monorepo-guards = { path = "../../libs/monorepo_guards", develop = true }
platform-core = { path = "../../libs/platform_core", develop = true }
psutil = "^7.0"

[tool.poetry.scripts]
tankpit-sniff = "tankpit_bot.sniffer.core:main"
tankpit-bot = "tankpit_bot.bot.entry:main"
tankpit-teleport-probe = "scripts.teleport_probe:main"
tankpit-enemy-teleport-probe = "scripts.enemy_teleport_probe:main"
tankpit-respawn-watch-probe = "scripts.respawn_watch_probe:main"
tankpit-key-probe = "scripts.key_probe:main"
tankpit-radar-watch-probe = "scripts.radar_watch_probe:main"
tankpit-density-probe = "scripts.density_probe:main"
tankpit-larder-probe = "scripts.larder_probe:main"
tankpit-mine-landing-probe = "scripts.mine_landing_probe:main"
tankpit-viewport-probe = "scripts.viewport_probe:main"
tankpit-fuel-probe = "scripts.fuel_probe:main"
tankpit-movement-probe = "scripts.movement_probe:main"
tankpit-combat-probe = "scripts.combat_probe:main"
tankpit-cadence-probe = "scripts.cadence_probe:main"
tankpit-weave-probe = "scripts.weave_probe:main"
tankpit-enemy-tracking-probe = "scripts.enemy_tracking_probe:main"
tankpit-issue-report = "tankpit_bot.diagnostics.issue_report_renderer:main"
tankpit-run-digest = "tankpit_bot.diagnostics.run_digest:main"
tankpit-feature-rows = "tankpit_bot.diagnostics.feature_rows:main"
tankpit-corpus-audit = "tankpit_bot.diagnostics.corpus_audit:main"
tankpit-fleet = "tankpit_bot.service.fleet:main"
tankpit-fleet-down = "tankpit_bot.service.fleet_control:down"
tankpit-audit = "tankpit_bot.validate.audit:main"
tankpit-shadow = "tankpit_bot.validate.shadow:main"
tankpit-roundtrip = "tankpit_bot.validate.roundtrip:main"
tankpit-sim-run = "tankpit_bot.sim.run:main"
tankpit-smoke = "scripts.smoke:main"
tankpit-bot-runs = "tankpit_bot.diagnostics.bot_runs_cli:main"
tankpit-bot-query = "tankpit_bot.diagnostics.bot_query:main"
tankpit-check-undecoded-fields = "scripts.check_undecoded_fields:main"
tankpit-wiki-anchors = "scripts.wiki_anchors:main"
tankpit-stream-probe = "scripts.stream_probe:main"
tankpit-tile-info = "tankpit_bot.diagnostics.tile_inspector:main"
tankpit-self-map = "tankpit_bot.diagnostics.self_map:main"
tankpit-entity-map = "tankpit_bot.diagnostics.entity_map:main"
tankpit-stats = "tankpit_bot.diagnostics.session_stats:main"
tankpit-run-audit = "tankpit_bot.diagnostics.run_audit:main"
tankpit-fight = "tankpit_bot.diagnostics.fight_report:main"
tankpit-engagements = "tankpit_bot.diagnostics.engagement_ledger:main"
tankpit-forage-economy = "tankpit_bot.diagnostics.forage_economy:main"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
pytest-xdist = "^3.8.0"
ruff = "^0.16.6"
mypy = "^2.3.1"
types-psutil = "^7.0"
pytest-timeout = "^2.4.0"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_subclassing_any = true
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
files = ["src", "tests", "scripts"]
mypy_path = ["src"]
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
exclude = [".venv", ".pytest_tmp"]

[tool.ruff.lint]
select = [
  "E","F","I","B","BLE","UP","N","C4","SIM","RET","C90","RUF","ANN"
]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "Do not use typing.Any; prefer precise types or Protocols/TypedDicts." }
"typing.cast" = { msg = "Do not use typing.cast; prefer adapters or precise types." }
"typing.TypeAlias" = { msg = "Do not use TypeAlias; use Literal types or expand unions explicitly." }

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true

[tool.coverage.run]
source = ["src", "scripts"]
branch = true
# Playwright's sync API drives the browser on a greenlet; without this,
# coverage loses the tracer across its context switches and under-counts
# in-process code that runs after a CDP call (e.g. screenshot decode).
# ``thread`` is added so the bot-service ``StatusBus`` /
# ``ModeBridge`` primitives — which cross the aiohttp thread and the
# tick-loop thread by design — get their arcs traced too.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v -n auto --dist loadscope"
# No ``--basetemp``. Pinning it to a fixed path inside the project makes two
# concurrent runs destroy each other: pytest DELETES basetemp at session
# start, so a second run (another agent, or a mutation sweep beside a
# ``make check``) wipes the first run's ``tmp_path`` directories mid-test.
# The failures land on whichever tests touch the filesystem -- screenshot and
# capture tests here -- and look like flaky browser behaviour rather than a
# config bug. pytest's default basetemp is per-run unique and rotates, which
# is what makes this working tree safe for more than one run at a time.
# ``asyncio_mode = "auto"`` treats every ``async def`` test as if it
# carried ``@pytest.mark.asyncio``. Without it the marker decorator
# leaks ``Any`` through mypy's strict rules; with it we type-check
# clean async tests without a decorator surface.
asyncio_mode = "auto"
# A HANG MUST PRESENT AS A FAILING TEST, NOT AS A SLOW RUN.
#
# This suite had no bound at all until 2026-09-04, and it cost three
# consecutive `make check` runs that day: a live-view test deadlocked in
# ``ThreadingMixIn.server_close`` (it joins handler threads, and one was parked
# on a silent Chrome socket with no timeout), and two tick-loop tests span
# forever because a change removed the exception that was their only exit. Each
# read as "the suite is slow" -- 36 minutes with a green-looking progress bar
# and no output -- and each was only diagnosed by going to the process table.
# 60 seconds would have named the test in every case.
#
# 600, and the number was measured TWICE because the first two guesses were
# both too tight. The bound has to clear the slowest legitimate test, which is
# NOT one of the real-Chromium ones -- it is
# ``test_this_package_passes_its_own_guard``, which shells out and walks all
# 1367 files, so it is disk-bound and degrades badly when 15 sibling workers
# are hammering the same disk.
#
#   solo, idle box        39.5 s for all three guard-shim tests
#   solo, later re-run    59.6 s for the same three
#   under -n auto         blew a 120 s bound, then blew a 300 s bound
#
# Contention is worth at least 5x here, and the solo figure itself moves by
# 50 per cent between runs, so a bound with only 3x headroom is a coin flip
# dressed as a limit. 600 gives 10x.
#
# It still does the whole job. The full suite is 3-7 minutes of wall clock
# across 16 workers, so ONE test reaching 600 s has taken longer than the
# entire run and is wedged by definition. The point was never a tight bound --
# it was turning a 36-minute silent stall into a named failing test.
#
# Not a per-test marker exemption on the guard shim. An exemption list is the
# signal that the predicate is wrong, and the predicate here is "how long may a
# single test legitimately take on a contended box" -- the honest answer is
# just larger than 120.
#
# Windows has no SIGALRM, so timeout_method can only be "thread", whose expiry
# calls os._exit(1): the worker dies with no cleanup and no protocol shutdown,
# and the xdist controller is left waiting on a dead channel. A timeout here is
# not a soft failure. See scripts/run-tests.ps1 for the 2026-08-19 incident and
# --max-worker-restart=0, which turns that into a loud stop rather than a
# 124-clone crash loop.
timeout = 600
timeout_method = "thread"
# THE BOUND COVERS THE TEST, NOT ITS FIXTURES' TEARDOWN.
#
# Default is false, which charges setup and teardown to the test they happen
# to bracket. Two modules here share a module-scoped headless Chromium because
# ``launch()`` is the expensive call, so ``browser.close()`` lands on whichever
# test ran LAST -- and on a host whose filesystem minifilter inspects browser
# teardown that close has been measured at tens of seconds on its own. The
# 2026-09-04 run that failed this way is the evidence: three real-browser tests
# passed and the fourth, the last in its module, took the worker down.
#
# Bounding that would be bounding the fixture, and reporting it would name the
# wrong test. What this loses is a hang INSIDE a fixture, and that is a real
# gap, stated rather than hidden. It costs nothing against the failures this
# setting exists for: both hangs on 2026-09-04 -- a tick loop with no exit and
# a ``server_close`` that joined a thread parked forever on a silent socket --
# were inside the test function, and both are still caught.
timeout_func_only = true
