# The public edge for the TankPit demo — a FILTER, not a proxy.
#
# The fleet manager serves one port. On it are three routes a stranger
# may use (``/demo/fleet``, ``/demo/spawn``, ``/demo/video/{slot}``) and
# a dozen an operator uses: ``/accounts`` names the game logins,
# ``/bots`` spawns any instance under any account in any room with no
# bound, ``DELETE /bots/{instance}`` removes one, and ``POST /shutdown``
# drains the whole fleet. Publishing the port publishes all of it.
#
# So this container is the boundary. It forwards exactly one prefix and
# answers 404 to everything else — the same answer an absent route
# gives, because a 403 would confirm to a prober that something is
# there. The fleet manager itself stays bound to loopback on the host
# (``127.0.0.1:27300`` in ../docker-compose.yml) and is reachable here
# only across the project's docker network, which the tunnel is not on.
#
# The default-deny is the point: a route added to the fleet manager
# tomorrow is NOT published by that act. Publishing takes an edit here.

# Docker's embedded DNS. Without this, nginx resolves the upstream once
# at startup and keeps the address forever — and, worse for this
# container, REFUSES TO START when the name does not resolve at all.
# The fleet is up only when somebody is running bots, so a
# startup-time resolve would make this edge depend on the thing it
# fronts. Resolved per request through a
# variable instead: nginx boots regardless and answers 502 while the
# fleet is down, which is the honest answer and the one the demo page
# renders as "offline".
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Liveness for the compose healthcheck. Says "this filter is up and
    # serving", nothing about the fleet behind it: folding the upstream
    # in would make the edge report unhealthy for a machine that is
    # simply not running bots right now.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 204;
    }

    # The published surface. The prefix is matched, the path is passed
    # through unchanged, and the fleet manager's own slot-grammar check
    # is what decides which video may be watched.
    location /demo/ {
        # In a variable so the name is resolved per request (see the
        # resolver note above). ``$request_uri`` rather than a rewrite:
        # the manager's routes are already at these paths.
        set $fleet_upstream "http://fleet:27300";
        proxy_pass $fleet_upstream$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Video is discrete HLS files now (playlist + ~2s segments),
        # not an endless MJPEG response, so default buffering is right:
        # a segment is a few hundred KB that nginx can take off the
        # manager in one gulp. HTTP/1.1 keep-alive still matters — a
        # player fetches a file every couple of seconds and reconnect
        # churn would dominate.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # /demo/fleet is polled and /demo/spawn is instant; nothing on
        # this surface holds a response open any more, so the default
        # 60s timeouts are generous rather than fatal.

        # The demo page is served from GitHub Pages at austinwagner.org
        # while this answers on tankpit.austinwagner.org, so the two are
        # different origins and the browser needs to be told the answer
        # may be read. ONE origin is named, not ``*``: the routes are
        # safe to call but there is no reason for any other site to be
        # able to read them, and a wildcard is a permission granted to
        # everybody forever.
        #
        # No preflight handling, deliberately: a bodyless GET or POST
        # with no custom headers is a CORS "simple request", so the
        # browser never sends OPTIONS. If a future call needs a header,
        # it needs an OPTIONS arm here — and having to add one is a
        # useful moment to ask whether the call belongs on this surface.
        add_header Access-Control-Allow-Origin "https://austinwagner.org" always;
        add_header Vary "Origin" always;
    }

    # Everything else, including the operator surface, does not exist as
    # far as this hostname is concerned.
    location / {
        return 404;
    }
}
