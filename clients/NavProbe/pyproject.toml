[build-system]
requires = ["poetry-core>=1.3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "nav-probe"
version = "0.1.0"
description = "Reproducibility instrument for simulated navigation: seeded rollouts, canonical digests, determinism verdicts"
authors = ["Austin Wagner <austinwagner@msn.com>"]
packages = [
  { include = "navprobe", from = "src" },
]
readme = "README.md"
include = ["src/navprobe/py.typed"]

# monorepo-guards is a develop path dependency, which installs a .pth into
# the venv. `import monorepo_guards` therefore resolves directly and
# scripts/guard.py needs no sys.path manipulation or dynamic import.
[tool.poetry.dependencies]
python = "^3.11"
monorepo-guards = { path = "../../libs/monorepo_guards", develop = true }
mujoco-mjx = "^3.11.0"
warp-lang = "^1.16.0"
mujoco-warp = "^3.11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-cov = "^7.0.0"
pytest-xdist = "^3.8"
ruff = "^0.14.4"
mypy = "^1.19"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_subclassing_any = true
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
files = ["src", "tests", "scripts"]
mypy_path = ["src"]
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
# Only third-party code is excluded. "runs" and "wiki" were listed here once and
# contained no Python at all, so they hid nothing and are gone: an exclusion that
# is inert today is an exemption waiting for someone to drop a file into it.
exclude = [".venv"]

[tool.ruff.lint]
select = [
  "E","F","I","B","BLE","UP","N","C4","SIM","RET","C90","RUF","ANN"
]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "Do not use typing.Any; prefer precise types or Protocols/TypedDicts." }
"typing.cast" = { msg = "Do not use typing.cast; prefer adapters or precise types." }
"typing.TypeAlias" = { msg = "Do not use TypeAlias; use Literal types or expand unions explicitly." }

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true

[tool.coverage.run]
source = ["src", "scripts"]
branch = true
# No ``concurrency`` tokens: this package imports neither greenlet nor
# threading. Declaring an unused token installs a heavier multi-context
# tracer and can hang the xdist combine step on Windows.

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# No --basetemp. Pinning it to a fixed path inside the project lets two
# concurrent runs destroy each other: pytest DELETES basetemp at startup,
# so a second run wipes the first one's tmp_path directories mid-test.
addopts = "-v -n auto --dist loadscope"
