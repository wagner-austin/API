name: covenant-ml

# The encrypted WRDS/HPC3 evaluator executes on Linux and requires actual
# POSIX private-directory modes and no-follow key opens. Run its entire suite
# on the deployment platform, without skipping security cases. The former
# WinDLL/EcoQoS tests cited here no longer live in covenant_ml; CPU determinism
# is supplied by platform_core. Windows ACLs are not certified by this lane.
#
# The RUSTFLAGS baseline is copied from packages.yml for the same reason it
# exists there: covenant_ml path-depends on cleargbm -> cleargbm_rs, whose
# .cargo/config.toml sets `-C target-cpu=native`, and a cached .venv holding
# a native-built extension can be restored onto a runner whose CPU lacks
# those instructions. The cache key covers the Rust sources too -- editing
# Rust changes no poetry.lock hash, and a lock-only key would greenlight a
# suite against a binary no longer in the tree.
#
# `shell: bash` for the reason navprobe pins it: GitHub runs pwsh steps with
# a single trailing `exit $LASTEXITCODE`, which propagates only the LAST
# command's status.

on:
  push:
    # Fleet source transport is checked by the submitting gate, not a CI branch.
    branches-ignore:
      - "pushed-tests/**"
    tags:
      - "**"
    paths:
      - "libs/covenant_ml/**"
      - "libs/covenant_domain/**"
      - "libs/platform_ml/**"
      - "libs/cleargbm/**"
      - "libs/cleargbm_rs/**"
      - "libs/platform_core/**"
      - "libs/monorepo_guards/**"
      - "monorepo-guards.toml"
      - ".github/workflows/covenant-ml.yml"
  pull_request:
    paths:
      - "libs/covenant_ml/**"
      - "libs/covenant_domain/**"
      - "libs/platform_ml/**"
      - "libs/cleargbm/**"
      - "libs/cleargbm_rs/**"
      - "libs/platform_core/**"
      - "libs/monorepo_guards/**"
      - "monorepo-guards.toml"
      - ".github/workflows/covenant-ml.yml"

concurrency:
  group: covenant-ml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Bounds a hang, not a slow run: 11m is the slowest of the last ten
    # successes, so this is ~3x headroom. The default is 360 minutes, and
    # an unbounded job on a frozen runner holds its concurrency slot for
    # six hours while reporting nothing.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: libs/covenant_ml
        shell: bash
    env:
      RUSTFLAGS: -C target-cpu=x86-64-v2

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==2.3.4

      # NO VENV CACHE, DELIBERATELY. covenant_ml's venv carries cu124 torch
      # and weighed in at 2.66GB on its first cached run -- a quarter of the
      # repository's whole 10GB Actions cache quota for one package, which
      # is the eviction-thrash arithmetic packages.yml documents at its own
      # cache step. A fresh install per run is the honest price; the same
      # trade every torch carrier in the shared matrix now makes.
      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry sync --no-cache --with dev

      - name: Guards
        run: poetry run python -m scripts.guard

      - name: Lint
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Types
        run: poetry run mypy

      - name: Tests
        run: >
          poetry run pytest -n auto
          --cov-branch --cov=src --cov=scripts --cov-report=term-missing
