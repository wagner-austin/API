---
name: Deploy Grandma API Frontend

"on":
  push:
    branches:
      - main
    paths:
      - "services/grandma-api/web/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 24 "Krypton", the Active LTS. This was 20 "Iron", whose
      # upstream support ENDED 2026-04-30 -- the page was being built by a
      # runtime that had stopped receiving security fixes four months
      # earlier. 24 also ships npm 11, which is what this package's
      # lockfile is now written by.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          cd services/grandma-api/web
          npm ci

      - name: Build TypeScript
        run: |
          cd services/grandma-api/web
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: services/grandma-api/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
