name: turkic-api

# The rule files this service vendors drifted for months against the project
# they came from, and the guard that would have caught it — a byte-identity
# check on those files — sat red and unrun because nothing executed this
# service's suite. That is what this workflow exists to prevent.

on:
  push:
    paths:
      - "services/turkic-api/**"
      - "libs/platform_core/**"
      - "libs/platform_workers/**"
      - "libs/monorepo_guards/**"
      - "monorepo-guards.toml"
      - ".github/workflows/turkic-api.yml"
  pull_request:
    paths:
      - "services/turkic-api/**"
      - "libs/platform_core/**"
      - "libs/platform_workers/**"
      - "libs/monorepo_guards/**"
      - "monorepo-guards.toml"
      - ".github/workflows/turkic-api.yml"

concurrency:
  group: turkic-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/turkic-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==2.3.4

      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: services/turkic-api/.venv
          key: turkic-api-venv-${{ hashFiles('services/turkic-api/poetry.lock') }}

      # `sync` rather than `install`: install leaves behind anything the lock
      # file no longer mentions, which is how a removed dependency kept
      # resolving out of a stale environment.
      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry sync --with dev

      - name: Guards
        run: poetry run python -m scripts.guard

      - name: Lint
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Types
        run: poetry run mypy src tests scripts

      - name: Tests
        run: >
          poetry run pytest -n auto
          --cov-branch --cov=src --cov=scripts --cov-report=term-missing
