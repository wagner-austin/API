name: packages

# THE GATE EXISTS FOR FORTY-THREE PACKAGES AND CI RAN IT FOR TWO.
#
# Every package under clients/, services/, libs/ and tools/ carries a `check`
# target and a scripts/guard.py -- all forty-three, with no exceptions. Until
# 2026-09-04, exactly two of those targets were executed by CI:
# services/turkic-api and clients/NavProbe. libs/platform_core appeared in
# turkic-api's path filter, but only as a TRIGGER for turkic-api's suite; its
# own 875 tests ran nowhere, and neither did tools/hpc3's 1381 nor
# clients/TankpitBot's 6938.
#
# That is the incident recorded in navprobe.yml's own header, unresolved:
# "The lesson had been encoded for one service rather than as a habit, so the
# next project without a workflow repeated it." Encoding it as a habit is what
# this file is. A package joins CI by HAVING A GATE, not by someone
# remembering to add it here.
#
# WHY A MATRIX AND NOT FORTY-ONE FILES. Forty-one near-identical workflows is
# the duplication that made a lifecycle bug need fixing thirty-six times in
# scripts/run-tests.ps1's header. A matrix cannot be path-filtered per entry,
# so the entry list is computed instead: scripts/ci_select_packages.py reads
# which packages a change actually affects, following the path dependencies
# each pyproject.toml already declares. A change to platform_core selects the
# thirty-eight packages that import it; a change to one client selects one.
# The selector is a plain script precisely so it can be run and checked
# locally rather than debugged through pushes.
#
# WHAT THIS DOES NOT COVER, deliberately:
#   * clients/NavProbe and services/turkic-api keep their own workflows. The
#     first MUST run on windows-latest -- its tests call the real Win32
#     boundary -- and folding a per-package runner into this matrix to serve
#     one package would put a hardcoded OS table here. The second is
#     established and green. Both are excluded by the selector's caller below,
#     not by a rule inside the selector.
#   * clients/TankpitBot keeps its own workflow on windows-latest. Its suite
#     is written against Windows separators and a case-insensitive filesystem
#     -- 17 failures on ubuntu, none of them a defect in the bot, all of them
#     a Windows path separator, which is an ordinary character on Linux.
#   * libs/cleargbm_rs is not a poetry project at all. It is a maturin/PEP-621
#     Rust extension built with uv (`uv pip install -e ".[dev]"`), and its gate
#     is cargo fmt, cargo clippy, cargo test and cargo llvm-cov at 100% SEGMENT
#     coverage beside the Python suite. `poetry sync --with dev` fails on it
#     with "Group(s) not found: dev" because it declares
#     `[project.optional-dependencies]`, not a poetry group. Forcing it through
#     this matrix would be pretending it is something it is not; it needs its
#     own workflow, which is filed rather than guessed at here.
#   * clients/OrderedKernels needs a GPU, and says so itself: "every Python
#     line in this package executes for real on a GPU". Its conftest skips
#     the whole suite when `torch.cuda.is_available()` is False, so on a CPU
#     runner it does not fail -- it runs nothing, and then fails the 100%
#     gate with a coverage figure measuring an empty run. It ALSO cannot
#     typecheck here: it deliberately declares no first-party path
#     dependencies (platform-ml pulls shap 0.50.0, which pins llvmlite to a
#     beta PyPI has deleted), and its Makefile builds and `--no-deps`
#     installs four sibling wheels on every lint. Replicating that here
#     would put a per-package build recipe in a generic matrix, and it would
#     still leave the suite skipping. This one wants a GPU runner, which is
#     a decision about infrastructure rather than a line of YAML.
#   * A first run of this is expected to find red packages. That is the point
#     and not a regression: a suite nothing has ever executed is not known to
#     pass, it is only unobserved. Anything it finds was already broken.
#
# WHAT THE FIRST RUN ACTUALLY FOUND, since the sentence above promised to
# look. Sixteen red of thirty-nine. Four were already fixed on main by the
# time the log was read. Four were real and are fixed: libs/cleargbm never
# ran a test at all (a non-portable Rust binary the runner's CPU could not
# execute), libs/covenant_nn and services/handwriting-ai were meeting a 100%
# gate with a graphics card rather than with tests, and libs/instrument_io
# asked whether a Windows .exe EXISTED when it meant whether this machine
# could run it. Of the rest, libs/platform_kaggle needs a Kaggle credential
# in CI -- `import kaggle` authenticates at import and calls exit(1), so two
# lines cannot execute without one -- and services/Art-Trainer's install
# timed out pulling multi-gigabyte CUDA wheels, which is install weight
# rather than a defect.

on:
  push:
  pull_request:

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.select.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The selector diffs against the previous state, which a shallow
          # clone does not have.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Select the packages this change affects
        id: select
        shell: bash
        run: |
          set -euo pipefail
          # A push carries `before`; a pull request carries a base sha. A
          # first push to a branch reports an all-zero `before`, which names
          # no commit -- fall back to the first parent so the diff is still
          # against something real rather than empty.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "diffing $base..${{ github.sha }}"
          git diff --name-only "$base" "${{ github.sha }}" > changed.txt || true
          # Packages with a dedicated workflow are checked there, not here.
          selected="$(python scripts/ci_select_packages.py < changed.txt \
            | python -c "import json,sys; own={'clients/NavProbe','services/turkic-api','libs/cleargbm_rs','clients/TankpitBot','clients/OrderedKernels'}; \
                         print(json.dumps([p for p in json.load(sys.stdin) if p not in own]))")"
          echo "selected: $selected"
          echo "packages=$selected" >> "$GITHUB_OUTPUT"

  check:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      # One package's failure must not cancel the rest: the first run of this
      # workflow is a survey, and a survey that stops at the first red tells
      # you one thing instead of forty.
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
        shell: bash
    env:
      # A PORTABLE CPU BASELINE, BECAUSE THE RUNNER THAT BUILDS A BINARY IS
      # NOT ALWAYS THE RUNNER THAT LOADS IT.
      #
      # libs/cleargbm path-depends on libs/cleargbm_rs, so `poetry sync`
      # compiles a Rust extension through maturin. That build reads
      # libs/cleargbm_rs/.cargo/config.toml, which sets
      # `-C target-cpu=native` and says in its own comment that the result
      # "is not portable across CPU generations" -- acceptable for a
      # locally-installed wheel, which is all it was ever used for.
      #
      # Then this workflow started caching `.venv`, and the two met.
      # GitHub's hosted pool is heterogeneous (Xeon Platinum 8272CL / 8370C,
      # EPYC 7763), so a `.so` built with one runner's feature set gets
      # restored onto a runner that lacks those instructions. The result was
      # `Fatal Python error: Illegal instruction` inside `create_module`
      # while importing cleargbm_rs -- every xdist worker dying at import,
      # `no tests ran`, and a coverage report of 18.15% that looked like a
      # missing test suite rather than a binary the CPU could not execute.
      #
      # `RUSTFLAGS` REPLACES `[build] rustflags` from .cargo/config.toml
      # rather than appending to it, so setting it here is what scopes the
      # native flag to local builds. The package's config file is untouched
      # on purpose: `docs/RESEARCH.md` registers `cleargbm`, and its
      # benchmark numbers were measured against the native build. Changing
      # what a developer's `make check` compiles would silently change the
      # artifact those numbers describe.
      #
      # x86-64-v2 rather than v3: CI answers "does it work", not "how fast",
      # and the widest floor is the one least likely to strand a future
      # runner. Verified locally -- 1685 Rust tests pass under this flag.
      RUSTFLAGS: -C target-cpu=x86-64-v2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==2.3.4

      # The key covers the Rust sources as well as the lock file, and that is
      # not belt-and-braces. A `.venv` holds COMPILED output from path
      # dependencies -- cleargbm_rs's extension module -- and editing Rust
      # changes none of the poetry.lock hashes. Keyed on the lock alone, a
      # Rust change would restore the previously built `.so` and the suite
      # would pass against code that is no longer in the tree, which is the
      # stale-artifact failure rather than a red build.
      #
      # It costs one cache miss across the matrix whenever the Rust changes.
      # Rust changes here are rare; a green run against the wrong binary is
      # not a trade worth making.
      - name: Cache the virtualenv
        uses: actions/cache@v6
        with:
          path: ${{ matrix.package }}/.venv
          key: pkg-${{ matrix.package }}-${{ hashFiles(format('{0}/poetry.lock', matrix.package), 'libs/cleargbm_rs/Cargo.lock', 'libs/cleargbm_rs/src/**') }}

      # `sync` rather than `install`, matching the other workflows: install
      # leaves behind anything the lock file no longer mentions, which is how
      # a removed dependency kept resolving out of a stale environment.
      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry sync --with dev

      - name: Guards
        run: poetry run python -m scripts.guard

      - name: Lint
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      # Bare `mypy`, with no paths. Every one of the 43 packages declares
      # `files = [...]` in its own `[tool.mypy]`, and naming paths here
      # OVERRIDES that -- which broke libs/cleargbm_rs, whose `src/` is Rust
      # and which correctly declares `files = ["tests", "scripts"]`. The
      # package knows what it type-checks; this job should not second-guess it.
      - name: Types
        run: poetry run mypy

      - name: Tests
        run: >
          poetry run pytest -n auto
          --cov-branch --cov=src --cov=scripts --cov-report=term-missing
