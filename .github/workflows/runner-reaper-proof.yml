# Prove, on a real self-hosted runner, that a cancelled job leaves nothing
# behind in its runner unit (MCPs board task 53528106, criterion A1).
#
# On 2026-10-02 cancelled Check runs left 158 processes and 17 GB in
# lavender's runners.slice with no job running: the runner kills its Worker
# and the step's process group, and whatever the job had put in a session
# of its own (a test's forkserver, a daemonized server) stayed in the
# unit's cgroup. tools/fleet now gives every WSL runner unit
# KillMode=control-group and installs fleet-runner-reaper, which empties a
# unit of such processes within 30 seconds of its job ending
# (tools/fleet/src/fleet/core/runner_reaper_render.py).
#
# This job reproduces the leak on demand. Its first step starts a sleep in
# a new session, named fleet-reaper-proof-<run id> so it can be found in
# the unit's cgroup, exactly as a forkserver escapes the step's process
# group. It carries no RUNNER_TRACKING_ID, the variable the runner's own
# end-of-job cleanup finds a job's processes by, because the 2026-10-02
# leftovers were evidently past that cleanup and the proof is of the case
# only the reaper catches. Its second step holds the job. Cancel the run
# during the second step and read the unit:
#
#   gh workflow run runner-reaper-proof.yml -f runner=lavender-wsl
#   gh run cancel <run id>
#   (as root in the distro) pgrep -af fleet-reaper-proof-<run id>
#
# With the reaper installed the daemon is gone within one minute of the
# cancel; without it, it sleeps out its 900 seconds in the unit. The
# daemon's own bound keeps a failed proof from holding anything longer.
name: runner-reaper-proof

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label to run on (e.g. lavender-wsl)"
        required: true
        type: string

jobs:
  hold:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - name: Leave a process in a session of its own, as a forkserver does
        run: |
          env -u RUNNER_TRACKING_ID setsid bash -c 'exec -a "fleet-reaper-proof-${{ github.run_id }}" sleep 900' < /dev/null > /dev/null 2>&1 &
          echo "left fleet-reaper-proof-${{ github.run_id }} as pid $!"
      - name: Hold the job until it is cancelled
        run: sleep 600
