name: tankpitbot

# TankpitBot's suite runs on Linux, where the bot deploys (`Dockerfile`,
# `python:3.11-slim-bookworm`) and where the fleet checks it: the
# clients/TankpitBot-linux fleet check read 7663 passed, 0 failed at 100.00%
# coverage on lacrymal at 823d9ecf2 on 2026-11-01.
#
# It ran on windows-latest from its first run until MCPs board task 0e0acaef,
# because the suite then split paths on a backslash and keyed artifacts by
# the platform separator, and on ubuntu read 17 failed / 6915 passed / 11
# errors. The fleet's Linux check above has passed the suite since, and
# Windows left the fleet on 2026-10-25. Windows then went red on its own: the
# runs on main from 2026-10-30 to da2d73747 failed `ValueError: path is on
# mount 'C:', start on mount 'D:'` (run 41618877041, 2 failed and 21 errors),
# the runner's temp directory on C: and the checkout on D:, which no Linux
# machine has.
#
# `shell: bash` is named so every step runs under `bash -e -o pipefail`: a
# failing `ruff check` followed by a passing `ruff format --check` fails the
# step rather than reporting the last command's status.

on:
  push:
    # Fleet source transport is checked by the submitting gate, not a CI branch.
    branches-ignore:
      - "pushed-tests/**"
    tags:
      - "**"
    paths:
      - "clients/TankpitBot/**"
      - "libs/platform_core/**"
      - "libs/monorepo_guards/**"
      - "monorepo-guards.toml"
      - ".github/workflows/tankpitbot.yml"
  pull_request:
    paths:
      - "clients/TankpitBot/**"
      - "libs/platform_core/**"
      - "libs/monorepo_guards/**"
      - "monorepo-guards.toml"
      - ".github/workflows/tankpitbot.yml"

concurrency:
  group: tankpitbot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # 10m is the slowest of the last eight successes; 3x headroom.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clients/TankpitBot
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==2.3.4

      - name: Cache the virtualenv
        uses: actions/cache@v6
        with:
          path: clients/TankpitBot/.venv
          key: tankpitbot-venv-${{ hashFiles('clients/TankpitBot/poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry sync --no-cache --with dev

      # Chromium only: the bot drives Chromium, and installing all three
      # engines costs minutes for engines nothing opens. `--with-deps`
      # installs the system libraries it loads on Linux through apt.
      - name: Install Chromium for Playwright
        run: poetry run playwright install --with-deps chromium

      - name: Guards
        run: poetry run python -m scripts.guard

      # These two are lint steps in the Makefile and this workflow does not
      # call make -- it restates the step list. Anything added to `make lint`
      # and not also added here runs on a developer's box and nowhere else.
      # The wiki gates were in exactly that position between 9f88148a and
      # this commit: enforced through pytest, but a violation arriving as
      # `assert 22 == 0` after the whole suite rather than as a named page
      # in a fast step, which was the entire motive for wiring them.
      - name: Undecoded-field check
        run: poetry run tankpit-check-undecoded-fields

      - name: Wiki gates
        run: poetry run tankpit-check-wiki

      - name: Lint
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Types
        run: poetry run mypy

      - name: Tests
        run: >
          poetry run pytest -n auto
          --cov-branch --cov=src --cov=scripts --cov-report=term-missing
